version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gradle
    directory: /gradle-plugin
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build

  # Stand-in upstreams and helper images of the e2e compose override.
  - package-ecosystem: docker-compose
    directory: /scripts/e2e
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: test
