name: Bug report
description: Something in Weaver doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, commands, or a minimal proto/Gradle setup.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Web UI, REST API, Gradle plugin, CLI, Worker / cleanup, Docker / deployment, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, CLI version or plugin version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove tokens and secrets first.
      render: text
