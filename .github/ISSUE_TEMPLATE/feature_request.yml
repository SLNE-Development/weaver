name: Feature request
description: Suggest something Weaver should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
