name: Release

# Pushing a tag vX.Y.Z publishes:
#   - the Docker image ghcr.io/slne-development/weaver:X.Y.Z and :latest
#   - the CLI to npm as `@slne/weaver-cli@X.Y.Z`              (secret NPM_TOKEN)
#   - the Gradle plugin dev.slne.weaver to https://reposilite.slne.dev/releases/
#                                                      (secrets SLNE_RELEASES_REPO_USERNAME, SLNE_RELEASES_REPO_PASSWORD)
# The tag must match the versions in packages/cli/package.json and gradle-plugin/build.gradle.kts.
# The image is pushed only after the e2e suite (.github/workflows/e2e.yml, local stand-in upstreams)
# passed; npm and Gradle publish only after the image was built and pushed.
# Third-party actions are pinned to commit SHAs; the comment names the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    name: Check versions against the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compare
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cli="$(node -p "require('./packages/cli/package.json').version")"
          plugin="$(sed -n 's/^version = "\(.*\)"$/\1/p' gradle-plugin/build.gradle.kts)"
          echo "tag=$VERSION cli=$cli gradle-plugin=$plugin"
          [ "$cli" = "$VERSION" ] || { echo "packages/cli/package.json has version $cli, tag is $VERSION" >&2; exit 1; }
          [ "$plugin" = "$VERSION" ] || { echo "gradle-plugin/build.gradle.kts has version $plugin, tag is $VERSION" >&2; exit 1; }

  e2e:
    name: E2E
    needs: versions
    uses: ./.github/workflows/e2e.yml
    with:
      upstreams: local

  image:
    name: Docker image
    needs: [versions, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/slne-development/weaver:${{ needs.versions.outputs.version }}
            ghcr.io/slne-development/weaver:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SLNE-Development/weaver
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    name: CLI to npm
    needs: [versions, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build test --filter=./packages/cli
      # @weaver/core and zod are bundled into dist by tsup; the published manifest keeps no
      # (workspace) dependencies and no scripts.
      - name: Strip development fields
        working-directory: packages/cli
        run: |
          npm pkg delete devDependencies scripts
          npm pack --dry-run
      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  gradle-plugin:
    name: Gradle plugin to reposilite.slne.dev
    needs: [versions, image]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test --no-daemon --console=plain
      - name: Publish
        env:
          SLNE_RELEASES_REPO_USERNAME: ${{ secrets.SLNE_RELEASES_REPO_USERNAME }}
          SLNE_RELEASES_REPO_PASSWORD: ${{ secrets.SLNE_RELEASES_REPO_PASSWORD }}
        run: ./gradlew publish --no-daemon --console=plain
