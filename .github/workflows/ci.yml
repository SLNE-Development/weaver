name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs; the comment names the release.
jobs:
  node:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      # Builds never need secrets; runtime validation still runs when the app starts.
      SKIP_ENV_VALIDATION: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run lint
      # Database, Valkey and S3 tests start their services with Testcontainers on the runner's Docker.
      - run: pnpm turbo run test

  gradle-plugin:
    name: Gradle plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test --no-daemon --console=plain

  # Real clients against the production image, with local stand-in upstreams only.
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
    with:
      upstreams: local
