services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weaver
      POSTGRES_PASSWORD: weaver
      POSTGRES_DB: weaver
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaver -d weaver"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Job queue for the background worker (BullMQ).
  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

  # S3-compatible object storage for development (MinIO no longer publishes images), bucket "weaver".
  # Dual storage (local primary + S3 for mirror caches): in .env keep STORAGE_DRIVER=local and
  # STORAGE_LOCAL_PATH, and set S3_ENDPOINT=http://localhost:9000, S3_BUCKET=weaver, S3_REGION and the keys.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=9000 -dir=/data
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # Healthy once both the master and the filer answer, so the bucket init cannot race the filer.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 2s
      timeout: 5s
      retries: 30

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    # Idempotent: an existing bucket (persisted volume) counts as success.
    entrypoint:
      - /bin/sh
      - -c
      - |
        out=$$(echo 's3.bucket.create -name weaver' | weed shell -master=seaweedfs:9333 2>&1)
        echo "$$out"
        case "$$out" in
          *"created bucket"*|*"already exists"*) exit 0 ;;
          *) exit 1 ;;
        esac
    restart: "no"

  # SeaweedFS admin panel: http://127.0.0.1:23646
  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.48
    command:
      - admin
      - -master=seaweedfs:9333
      - -port=23646
      - -dataDir=/data
      - -adminUser=${SEAWEEDFS_ADMIN_USER:-admin}
      - -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD:-admin}
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:23646:23646"
    volumes:
      - seaweedfs-admin-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:23646/health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
  seaweedfs-admin-data:
