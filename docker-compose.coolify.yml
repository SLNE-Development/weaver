# Weaver on Coolify (Docker Compose build pack).
#
# Variables YOU must set in Coolify (Environment Variables tab):
#   BETTER_AUTH_URL   REQUIRED. The public https URL users open, e.g. https://weaver.example.com.
#                     Deliberately NOT taken from the generated service URL: behind a Cloudflare Tunnel
#                     Coolify's service URL is plain http, but OAuth callbacks, secure cookies and every
#                     absolute link must be https. Set the same domain on the `weaver` service.
#   INITIAL_ADMIN     github:<login> or discord:<user id>, the first admin account. REQUIRED for the first
#                     deploy: login is OAuth-only and sign-up needs an invite, so without it nobody can ever
#                     sign in to a fresh instance. It is inert once an admin exists, so you may remove it later.
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET     and/or
#   DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET   At least one complete provider is required.
#                     Callback URLs: ${BETTER_AUTH_URL}/api/auth/callback/github and .../discord
# Cloudflare: proxied hostnames limit request bodies to 100 MB on most plans, and docker pushes each layer
#   in one request, so a larger layer fails with 413. Push large images through a DNS-only (unproxied)
#   hostname that points at the server, not through the proxy or tunnel.
# Storage: the default is the bundled SeaweedFS. The seaweedfs, seaweedfs-init and seaweedfs-admin services
#   ALWAYS start, and `weaver` waits for seaweedfs-init, whatever STORAGE_DRIVER says.
#   To use local storage (STORAGE_DRIVER=local) or an external S3 (STORAGE_DRIVER=s3 + S3_ENDPOINT, S3_BUCKET,
#   S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY), set those variables AND edit this file: delete the
#   seaweedfs, seaweedfs-init and seaweedfs-admin services, the `seaweedfs-init` entry under
#   weaver.depends_on, and the seaweedfs-data / seaweedfs-admin-data volumes. For local storage only, also
#   change S3_BUCKET below to "" so no S3 store is configured.
# Dual storage: STORAGE_LOCAL_PATH is always set, so with the bundled SeaweedFS both stores are configured.
#   STORAGE_DRIVER=local keeps hosted content on the storage-data volume; pick S3 as "Default cache storage"
#   in the admin settings (or per mirror) to put mirror caches on SeaweedFS.
#
# Generated by Coolify (do not set): SERVICE_USER_POSTGRES, SERVICE_PASSWORD_POSTGRES,
#   SERVICE_BASE64_64_BETTERAUTH (becomes BETTER_AUTH_SECRET), SERVICE_USER_SEAWEEDFS and
#   SERVICE_PASSWORD_SEAWEEDFS (S3 keys), SERVICE_USER_SEAWEEDFSADMIN and
#   SERVICE_PASSWORD_SEAWEEDFSADMIN (login of the weed admin panel).
# SERVICE_FQDN_* only routes traffic; the application never reads it.
#
# Image: weaver and worker pull the published ghcr.io/slne-development/weaver:latest. Set
#   WEAVER_IMAGE to pin a release (e.g. ghcr.io/slne-development/weaver:0.1.0). To build from
#   source instead, add to both services:
#     build:
#       context: .
#       dockerfile: docker/Dockerfile
#   and set WEAVER_IMAGE=weaver:local.

x-weaver-env: &weaver-env
  DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-weaver}
  VALKEY_URL: redis://valkey:6379
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_LOCAL_PATH: /data/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_BUCKET: ${S3_BUCKET:-weaver}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${SERVICE_USER_SEAWEEDFS}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${SERVICE_PASSWORD_SEAWEEDFS}}
  BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_BETTERAUTH}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public https URL, e.g. https://weaver.example.com}
  INITIAL_ADMIN: ${INITIAL_ADMIN:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}

services:
  weaver:
    image: ${WEAVER_IMAGE:-ghcr.io/slne-development/weaver:latest}
    command: ["web"]
    restart: unless-stopped
    environment:
      <<: *weaver-env
      SERVICE_FQDN_WEAVER_3000: ""
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${WEAVER_IMAGE:-ghcr.io/slne-development/weaver:latest}
    command: ["worker"]
    restart: unless-stopped
    environment: *weaver-env
    volumes:
      - storage-data:/data/storage
    depends_on:
      weaver:
        condition: service_healthy # applies migrations
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');process.exit(f.readdirSync('/proc').some(p=>/^\\d+$/.test(p)&&f.readFileSync('/proc/'+p+'/cmdline','utf8').includes('apps/worker/'+'dist'))?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-weaver}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    # BullMQ requires noeviction.
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  # S3 storage. Master (9333) and S3 (8333) stay on the internal network only.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -dir=/data -ip.bind=0.0.0.0
    environment:
      # Fallback admin identity of the S3 gateway.
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_SEAWEEDFS}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_SEAWEEDFS}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: creates the bucket, then exits.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    exclude_from_hc: true
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      BUCKET: ${S3_BUCKET:-weaver}
    # Idempotent: `s3.bucket.create` exits 1 with "already exists" on every redeploy with a persisted volume.
    entrypoint:
      - /bin/sh
      - -c
      - |
        out=$$(echo "s3.bucket.create -name $$BUCKET" | weed shell -master=seaweedfs:9333 2>&1)
        echo "$$out"
        case "$$out" in
          *"created bucket"*|*"already exists"*) exit 0 ;;
          *) exit 1 ;;
        esac

  # `weed admin` web panel. Always password protected (the compose file refuses to deploy without one).
  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # Credentials go through an options file written at start, so they do not appear in the process list.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf 'adminUser=%s\nadminPassword=%s\n' "$$ADMIN_USER" "$$ADMIN_PASSWORD" > /tmp/admin.options
        exec weed admin -port=23646 -master=seaweedfs:9333 -dataDir=/data -ip=0.0.0.0 -options=/tmp/admin.options
    environment:
      SERVICE_FQDN_SEAWEEDFSADMIN_23646: ""
      ADMIN_USER: ${SERVICE_USER_SEAWEEDFSADMIN:?}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_SEAWEEDFSADMIN:?}
    volumes:
      - seaweedfs-admin-data:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 23646"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  valkey-data:
  storage-data:
  seaweedfs-data:
  seaweedfs-admin-data:
